# La escalera canonica de 6 peldanios. El detalle legal local vive en
# status_local_label y no se publica.
status_ladder:
  1: { code: undocumented,      es: "Sin documentacion migratoria", en: "Undocumented" }
  2: { code: in_process,        es: "Tramite iniciado, sin resolucion", en: "Application filed, undecided" }
  3: { code: transit_permit,    es: "Permiso de transito o permanencia transitoria", en: "Transit or transitory stay permit" }
  4: { code: temporary_stay,    es: "Permanencia temporal", en: "Temporary stay" }
  5: { code: work_authorised,   es: "Permanencia con autorizacion laboral", en: "Stay with work authorisation" }
  6: { code: permanent,         es: "Permanencia indefinida o nacionalizacion", en: "Permanent stay or naturalisation" }

