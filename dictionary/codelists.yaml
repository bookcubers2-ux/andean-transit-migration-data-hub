  routine:            { es: "Registro rutinario", en: "Routine record" }
  operativo:          { es: "Operativo de control", en: "Enforcement operation" }
  post_policy_change: { es: "Dentro de los 30 dias de un cambio normativo", en: "Within 30 days of a policy change" }
  unknown:            { es: "No determinado", en: "Not determined" }

formality:
