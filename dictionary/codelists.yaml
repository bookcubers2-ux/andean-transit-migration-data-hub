  "gt48":  { es: "Mas de 48 h/semana", en: "Over 48 h/week" }

# Multiplos del salario minimo nacional. NUNCA montos absolutos, porque un
# monto exacto en un municipio pequenio identifica al empleador.
earnings_band_smn:
  "lt050":  { es: "Menos de 0,5 SMN", en: "Under 0.5 NMW" }
  "050_099":{ es: "0,5 a 0,99 SMN", en: "0.5 to 0.99 NMW" }
  "100_149":{ es: "1,0 a 1,49 SMN", en: "1.0 to 1.49 NMW" }
  "150_199":{ es: "1,5 a 1,99 SMN", en: "1.5 to 1.99 NMW" }
  "ge200":  { es: "2 SMN o mas", en: "2 NMW or more" }
  "NR":     { es: "No responde", en: "No answer" }

job_search_channel:
